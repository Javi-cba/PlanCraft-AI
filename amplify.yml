version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - curl -fsSL https://bun.sh/install | bash
            - export BUN_INSTALL="$HOME/.bun"
            - export PATH="$BUN_INSTALL/bin:$PATH"
            - bun install --frozen-lockfile
        build:
          commands:
            - export PATH="$HOME/.bun/bin:$PATH"
            # Amplify expone las env vars en el build pero no en el runtime del
            # server de Next. Volcarlas a .env.production hace que el server las
            # lea en cada request (si no, Clerk no encuentra CLERK_SECRET_KEY y
            # el middleware devuelve 500 en todas las rutas).
            - env | grep -e CLERK_SECRET_KEY -e NEXT_PUBLIC_ >> .env.production
            - bun run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
